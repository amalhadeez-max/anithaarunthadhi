# Netlify build settings for the Next.js 15 app.
# The Next.js runtime (@netlify/plugin-nextjs) is auto-installed by Netlify; do not pin it.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Keep Prisma's generated client out of the secrets scanner noise
  SECRETS_SCAN_OMIT_PATHS = ".next/**/*.wasm"

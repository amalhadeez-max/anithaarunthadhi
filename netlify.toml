# Netlify build settings for the Next.js 15 app.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = ".next/**/*.wasm"

# Next.js runtime (OpenNext adapter). Netlify installs the current version at build time; do not pin.
[[plugins]]
  package = "@netlify/plugin-nextjs"
